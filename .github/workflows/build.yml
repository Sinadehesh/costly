name: Android APK Build

on:
  # Feature branches too, not just main. The Kotlin can't be compiled in the
  # sandboxes this repo is often edited from (no Android SDK), so CI is the
  # first real compiler it meets — and it has already caught errors that
  # review missed. Waiting until merge to find out is the expensive order.
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper and Build APK
      run: |
        cd android
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: costly-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
