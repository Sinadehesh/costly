<!--
  COSTLY — the mark alone, inverted for dark backgrounds, on transparency. The furious cat from CatWidget's
  tier-3 face. Pure paths, no text, so it renders identically everywhere and
  scales without a font dependency.
  Ink is #F2F4EF; on dark backgrounds use costly-mark-light.svg instead.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 72" width="100" height="72">
  <g stroke="#F2F4EF" stroke-width="3" stroke-linecap="round">
    <line x1="7" y1="47" x2="34" y2="50" />
    <line x1="7" y1="56" x2="34" y2="55" />
    <line x1="93" y1="47" x2="66" y2="50" />
    <line x1="93" y1="56" x2="66" y2="55" />
  </g>
  <polygon points="26,24 33,3 49,18" fill="#F2F4EF" />
  <polygon points="74,24 67,3 51,18" fill="#F2F4EF" />
  <path d="M14,66 V46 a36,33 0 0 1 72,0 V66 Z" fill="#F2F4EF" />
  <polygon points="30,41 47,48 46,53 30,47" fill="#0B0D0A" />
  <polygon points="70,41 53,48 54,53 70,47" fill="#0B0D0A" />
  <circle cx="39" cy="47" r="2.6" fill="#F2F4EF" />
  <circle cx="61" cy="47" r="2.6" fill="#F2F4EF" />
  <ellipse cx="50" cy="59" rx="6.5" ry="5" fill="#0B0D0A" />
</svg>
