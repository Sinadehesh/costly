name: Android APK Build

on:
  # Feature branches too, not just main. The Kotlin can't be compiled in the
  # sandboxes this repo is often edited from (no Android SDK), so CI is the
  # first real compiler it meets — and it has already caught errors that
  # review missed. Waiting until merge to find out is the expensive order.
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # The money math lives on the web side; run its tests + typecheck too, so a
  # broken split/cap can't reach main just because the APK still compiles.
  web:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: cd web && npm ci

    - name: Generate Prisma client
      run: cd web && npx prisma generate

    - name: Typecheck
      run: cd web && npm run typecheck

    - name: Unit tests
      run: cd web && npm test

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # The run number becomes versionCode/versionName, so the APK on the phone
    # can be checked against the build it came from. Without it every APK
    # claimed to be version 1 and a successful install was indistinguishable
    # from no install at all.
    - name: Generate Gradle Wrapper and Build APK
      run: |
        cd android
        gradle wrapper
        ./gradlew assembleDebug -PcostlyBuildNumber=${{ github.run_number }}

    # Pure-JVM unit tests for the billing-critical logic (DoomscrollDetector,
    # MeterMath). No device or emulator needed. Runs after the build so a
    # compile error still surfaces as a build failure first.
    - name: Run Android unit tests
      run: |
        cd android
        ./gradlew testDebugUnitTest

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-unit-test-report
        path: android/app/build/reports/tests/testDebugUnitTest

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: costly-debug-apk-${{ github.run_number }}
        path: android/app/build/outputs/apk/debug/app-debug.apk
